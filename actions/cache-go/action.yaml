name: cache Go
description: Restore and save Go build caches, including the golangci-lint analysis cache by default.

inputs:
  golangci-lint:
    description: Cache golangci-lint analysis data. golangci-lint must be installed separately.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore Go cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-
    - name: Restore golangci-lint cache
      if: inputs.golangci-lint == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/golangci-lint
        key: golangci-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum', '.golangci.yml', 'aqua.yaml') }}
        restore-keys: |
          golangci-${{ runner.os }}-
