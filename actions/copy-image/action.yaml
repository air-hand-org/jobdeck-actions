name: copy image
description: Copy an image between registries with Docker Buildx. Authenticate to both registries before use.

inputs:
  src:
    description: Fully-qualified source image reference.
    required: true
  dest:
    description: Fully-qualified destination image reference.
    required: true
  if-missing:
    description: Copy only when dest does not exist.
    required: false
    default: "true"

outputs:
  copied:
    description: Whether an image was copied.
    value: ${{ steps.copy.outputs.copied || 'false' }}

runs:
  using: composite
  steps:
    - name: Check destination image
      id: destination
      if: inputs.if-missing == 'true'
      uses: $/actions/image-exists
      with:
        image: ${{ inputs.dest }}
    - name: Copy image
      id: copy
      if: inputs.if-missing != 'true' || steps.destination.outputs.exists == 'false'
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.src }}
        DESTINATION_IMAGE: ${{ inputs.dest }}
      run: |
        docker buildx imagetools create --tag "$DESTINATION_IMAGE" "$SOURCE_IMAGE"
        echo "copied=true" >> "$GITHUB_OUTPUT"
