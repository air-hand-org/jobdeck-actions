name: setup tools
description: Set up project tools with aqua and mise.

inputs: {}
runs:
  using: composite
  steps:
    - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
      with:
        aqua_version: v2.64.0
        aqua_opts: ""
    - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        cache: true
