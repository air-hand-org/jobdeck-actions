name: setup tools
description: Set up project tools with aqua and mise.

inputs: {}
runs:
  using: composite
  steps:
    - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
      with:
        aqua_version: v2.65.2
        aqua_opts: ""
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        cache: true
