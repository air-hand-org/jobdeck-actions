name: setup tools
description: Set up project tools with aqua and mise.

inputs: {}
runs:
  using: composite
  steps:
    - uses: aquaproj/aqua-installer@b8be739961814ee66b9e0d505f4d5de0d2eff047 # v4.1.2
      with:
        aqua_version: v2.66.1
        aqua_opts: ""
    - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        cache: true
