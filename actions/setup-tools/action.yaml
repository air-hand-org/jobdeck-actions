name: setup tools
description: Set up project tools with aqua and mise.

inputs: {}
runs:
  using: composite
  steps:
    - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.65.2
        aqua_opts: ""
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        cache: true
