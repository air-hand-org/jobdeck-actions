name: setup tools
description: Set up project tools with aqua and mise.

inputs: {}
runs:
  using: composite
  steps:
    - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.66.1
        aqua_opts: ""
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: true
