name: Reusable release service dispatch

on:
  workflow_call:
    inputs:
      service-name:
        required: false
        type: string
        default: ""
      service-names:
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  release-dispatch:
    runs-on: ubuntu-slim
    steps:
      - name: Create release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          owner: ${{ github.repository_owner }}
          repositories: |
            jobdeck
      - name: Release dispatch
        uses: $/actions/release-dispatch
        with:
          service-name: ${{ inputs.service-name }}
          service-names: ${{ inputs.service-names }}
          github-token: ${{ steps.app-token.outputs.token }}
